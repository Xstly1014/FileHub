services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      FILEHUB_RUNTIME_DIR: /app/runtime
      FILEHUB_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
